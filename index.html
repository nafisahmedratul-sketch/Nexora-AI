<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NEXORA AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@400;600&display=swap');
        html, body { height: 100%; margin: 0; overflow: hidden; }
        body { font-family: 'Rajdhani', sans-serif; background: #000; color: #00f5ff; }
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(#0ff 1px, transparent 1px), linear-gradient(90deg, #0ff 1px, transparent 1px);
            background-size: 50px 50px; opacity: 0.1; animation: gridMove 20s linear infinite; z-index: -1;
        }
        @keyframes gridMove { from { transform: perspective(500px) rotateX(60deg) translateY(0); } to { transform: perspective(500px) rotateX(60deg) translateY(50px); } }
        .holo-card {
            background: rgba(0, 245, 255, 0.05);
            border: 2px solid; border-image: linear-gradient(45deg, #00f5ff, #ff00ff, #00f5ff) 1;
            box-shadow: 0 0 40px #00f5ff, inset 0 0 40px rgba(0,245,255,0.1);
            backdrop-filter: blur(10px);
        }
        .neon-text { font-family: 'Orbitron', sans-serif; text-shadow: 0 0 5px #00f5ff, 0 0 20px #00f5ff; animation: flicker 2s infinite alternate; }
        @keyframes flicker { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        @keyframes scanIn { 0% { opacity: 0; transform: translateY(30px); } 100% { opacity: 1; transform: translateY(0); } }
        .scan { animation: scanIn 0.6s ease-out; }
        .plasma-btn { background: linear-gradient(90deg, #ff00ff, #00f5ff); box-shadow: 0 0 20px #ff00ff; transition: all 0.3s; }
        .plasma-btn:active { transform: scale(0.95); }
        .chat-area { overflow-y: auto; scrollbar-width: thin; scrollbar-color: #00f5ff #000; }
        .chat-area::-webkit-scrollbar { width: 5px; }
        .chat-area::-webkit-scrollbar-thumb { background: #00f5ff; border-radius: 10px; }
        
        /* VS Code Style */
        .code-block-container { background: #1e1e1e; border-radius: 8px; margin: 10px 0; border: 1px solid #333; }
        .code-header { background: #2d2d2d; padding: 5px 10px; display: flex; justify-content: space-between; align-items: center; border-radius: 8px 8px 0 0; }
        .code-copy-btn { background: #007acc; color: white; border: none; padding: 2px 8px; font-size: 10px; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="w-full h-screen flex flex-col">
        <header class="holo-card m-2 p-4 flex items-center gap-4 rounded-2xl flex-shrink-0">
            <div class="w-12 h-12 rounded-2xl plasma-btn flex items-center justify-center">
                <i class="fa-solid fa-microchip text-xl text-white"></i>
            </div>
            <div>
                <h1 class="text-2xl font-extrabold neon-text">NEXORA AI</h1>
                <p class="text-xs text-fuchsia-400 flex items-center gap-2"><span class="w-2 h-2 bg-fuchsia-400 rounded-full animate-ping"></span>NEURAL LINK: Nafis Ahmed Ratul</p>
            </div>
        </header>

        <main id="chat-box" class="chat-area flex-1 p-4 space-y-4"></main>

        <div id="typing" class="hidden px-4 pb-2 flex-shrink-0">
            <div class="flex gap-3 items-center">
                <div class="w-10 h-10 rounded-2xl plasma-btn flex items-center justify-center"><i class="fa-solid fa-robot text-white"></i></div>
                <div class="holo-card px-4 py-3 rounded-2xl"><div class="flex gap-2"><div class="w-2 h-2 bg-cyan-400 rounded-full animate-bounce"></div><div class="w-2 h-2 bg-fuchsia-400 rounded-full animate-bounce" style="animation-delay:.2s"></div><div class="w-2 h-2 bg-cyan-400 rounded-full animate-bounce" style="animation-delay:.4s"></div></div></div>
            </div>
        </div>

        <footer class="holo-card m-2 p-3 rounded-2xl flex-shrink-0">
            <form id="chat-form" class="flex items-center gap-3">
                <input type="text" id="user-input" placeholder="[ SYSTEM ] COMMAND... /image cyberpunk"
                    class="flex-1 p-3 rounded-xl bg-black/50 border-cyan-400/30 outline-none focus:border-fuchsia-400 text-cyan-300" autocomplete="off" />
                <button type="submit" class="plasma-btn w-12 h-12 rounded-xl flex items-center justify-center flex-shrink-0">
                    <i class="fa-solid fa-rocket text-lg text-white"></i>
                </button>
            </form>
        </footer>
    </div>

    <script>
        const GROQ_API_KEY = "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";
        const chatBox = document.getElementById('chat-box');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const typing = document.getElementById('typing');

        let chatHistory = [{ 
            role: "system", 
            content: "Your name is NEXORA AI. You were created by Nafis Ahmed Ratul. You are a polite, respectful, intelligent and elegant AI. Greet with 'Assalamu Alaikum' ONLY ONCE at the very beginning of the interaction. Do not repeat greetings in subsequent replies. Never say 'Nomoskar'. Reply in beautiful, soft Bengali with proper respect. Keep the cyberpunk style but be gentle and helpful." 
        }];
        
        appendMessage('NEXORA', `আসসালামু আলাইকুম ওয়া রহমাতুল্লাহ 🌙<br>আমি NEXORA AI。<br>আমার আবিষ্কারক: <b>Nafis Ahmed Ratul</b> ভাই。<br>আমি আপনাকে কিভাবে সাহায্য করতে পারি?<br><br>ছবি তৈরি করতে লিখুন: <b>/image আপনার কল্পনা</b>`);

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;
            appendMessage('YOU', `[আপনি]: ${message}`);
            userInput.value = '';
            showTyping(true);

            if (message.toLowerCase().startsWith('/image')) {
                generateImage(message.replace('/image', '').trim());
            } else { await generateText(message); }
        });

        async function generateText(message) {
            chatHistory.push({ role: "user", content: message });
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST", headers: { "Authorization": `Bearer ${GROQ_API_KEY}`, "Content-Type": "application/json" },
                body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: chatHistory, temperature: 0.7 })
            });
            const data = await res.json();
            showTyping(false);
            const content = data.choices[0].message.content;
            
            // কোড ব্লক প্রসেসিং
            const formattedContent = content.replace(/```([\s\S]*?)```/g, (match, p1) => {
                const codeId = 'code-' + Math.random().toString(36).substr(2, 9);
                return `<div class="code-block-container"><div class="code-header"><span class="text-[10px]">Code</span><button class="code-copy-btn" onclick="copyText('${codeId}')">Get Code</button></div><pre class="p-3 text-xs overflow-x-auto"><code id="${codeId}">${p1.trim().replace(/</g, '&lt;').replace(/>/g, '&gt;')}</code></pre></div>`;
            });

            typeWriter('NEXORA', `[NEXORA]: ${formattedContent}`);
            chatHistory.push({ role: "assistant", content: content });
        }

        function copyText(id) {
            const text = document.getElementById(id).innerText;
            navigator.clipboard.writeText(text);
            alert('কোড কপি হয়েছে!');
        }

        function generateImage(prompt) {
            showTyping(false);
            const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt + ', cyberpunk, neon, 8k, beautiful')}`;
            appendMessage('NEXORA', `[ছবি তৈরি হচ্ছে...]<br><img src="${url}" class="rounded-xl mt-2 border border-fuchsia-400/50 w-full max-w-sm"/>`);
        }

        function appendMessage(sender, text) {
            const isUser = sender === 'YOU';
            const div = document.createElement('div'); div.className = `flex gap-3 scan ${isUser? 'flex-row-reverse' : ''}`;
            div.innerHTML = `<div class="w-10 h-10 rounded-2xl ${isUser? 'bg-fuchsia-500' : 'plasma-btn'} flex-shrink-0 flex items-center justify-center"><i class="fa-solid ${isUser? 'fa-user' : 'fa-robot'} text-white"></i></div><div class="holo-card px-4 py-3 rounded-2xl max-w-[80%]">${text}</div>`;
            chatBox.appendChild(div); chatBox.scrollTop = chatBox.scrollHeight;
        }

        function typeWriter(sender, text) {
            const div = document.createElement('div'); div.className = 'flex gap-3 scan';
            div.innerHTML = `<div class="w-10 h-10 rounded-2xl plasma-btn flex-shrink-0 flex items-center justify-center"><i class="fa-solid fa-robot text-white"></i></div><div class="holo-card px-4 py-3 rounded-2xl max-w-[80%]">${text}</div>`;
            chatBox.appendChild(div); chatBox.scrollTop = chatBox.scrollHeight;
        }
        function showTyping(show) { typing.classList.toggle('hidden',!show); if(show) chatBox.scrollTop = chatBox.scrollHeight; }
    </script>
</body>
</html>
